
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StallMaster POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-scale-in {
            animation: scaleIn 0.2s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        /* Dashboard styling */
        .dashboard-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        #analytics-map {
            height: 300px;
            width: 100%;
            border-radius: 1rem;
            z-index: 1;
        }
        .sync-pulse {
            animation: pulse-blue 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-blue {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* ENERGY SAVING MODE (Low Power) */
        .low-power {
            background-color: #000000 !important;
        }
        .low-power * {
            animation: none !important;
            transition-duration: 0ms !important;
            box-shadow: none !important;
            text-shadow: none !important;
        }
        /* Override common backgrounds in saving mode */
        .low-power .bg-white, 
        .low-power .bg-slate-50, 
        .low-power .bg-slate-100 {
            background-color: #000000 !important;
            border-color: #1e293b !important; /* slate-800 */
        }
        .low-power .text-slate-800, 
        .low-power .text-slate-900, 
        .low-power .text-slate-700 {
            color: #cbd5e1 !important; /* slate-300 */
        }
        .low-power .text-slate-400, 
        .low-power .text-slate-500 {
            color: #475569 !important; /* slate-600 */
        }
        .low-power img {
            filter: grayscale(0.5) contrast(0.8) brightness(0.6);
        }
        .low-power .dashboard-card {
            background: #000000 !important;
            border: 1px solid #1e293b !important;
            box-shadow: none !important;
        }
        .low-power .bg-blue-600 {
            background-color: #1e3a8a !important; /* Muted blue for saving */
        }
        .low-power .text-blue-600 {
            color: #60a5fa !important;
        }
    </style>
<script type="importmap">

    "jszip": "https://esm.sh/jszip@3.10.1"
  }
}
</script>
</head>

</body>
