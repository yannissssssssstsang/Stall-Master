
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StallMaster POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .animate-scale-in {
            animation: scaleIn 0.2s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        /* Dashboard styling */
        .dashboard-card {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
        }
        #analytics-map {
            height: 300px;
            width: 100%;
            border-radius: 1rem;
            z-index: 1;
        }
        .sync-pulse {
            animation: pulse-blue 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-blue {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* DARK MODE UI REPLACEMENT */
        .dark-mode {
            background-color: #0f172a !important; /* slate-900 */
            color: #f1f5f9 !important;
        }
        .dark-mode .bg-white, 
        .dark-mode .bg-slate-50, 
        .dark-mode .bg-slate-100 {
            background-color: #1e293b !important; /* slate-800 */
            border-color: #334155 !important; /* slate-700 */
        }
        .dark-mode .text-slate-800, 
        .dark-mode .text-slate-900, 
        .dark-mode .text-slate-700 {
            color: #f1f5f9 !important; 
        }
        .dark-mode .text-slate-400, 
        .dark-mode .text-slate-500,
        .dark-mode .text-slate-600 {
            color: #94a3b8 !important; /* slate-400 */
        }
        .dark-mode .dashboard-card {
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .dark-mode .border-slate-100,
        .dark-mode .border-slate-200 {
            border-color: #334155 !important;
        }
        .dark-mode input, .dark-mode select, .dark-mode textarea {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f1f5f9 !important;
        }
        .dark-mode .bg-blue-50 {
            background-color: rgba(30, 58, 138, 0.3) !important;
        }
        .dark-mode .text-blue-600 {
            color: #60a5fa !important;
        }
        /* Leaflet Dark Theme adjustment */
        .dark-mode #analytics-map {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",

    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "jszip": "https://esm.sh/jszip@3.10.1"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
</body>
</html>
